[package]
name = "exchange_match"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The crossing engine — an incoming order against a book, producing trades"

[dependencies]
exchange_types = { path = "../exchange_types", version = "0.1.0" }
exchange_book = { path = "../exchange_book", version = "0.1.0" }
exchange_conserve = { path = "../exchange_conserve", version = "0.1.0" }
exchange_fill = { path = "../exchange_fill", version = "0.1.0" }
exchange_id = { path = "../exchange_id", version = "0.1.0" }
exchange_order = { path = "../exchange_order", version = "0.1.0" }
exchange_side = { path = "../exchange_side", version = "0.1.0" }
exchange_stp = { path = "../exchange_stp", version = "0.1.0" }
exchange_tif = { path = "../exchange_tif", version = "0.1.0" }
exact_arith = { workspace = true }

[dev-dependencies]
# The test helpers' `Order` fixtures need a `Sequence` value for `Resting`'s
# `arrival` — nothing in this crate's own src/ reads one.
exchange_seq = { path = "../exchange_seq", version = "0.1.0" }

[lints]
workspace = true
