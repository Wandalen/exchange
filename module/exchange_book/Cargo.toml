[package]
name = "exchange_book"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The resting order book and its price-time priority ordering"
publish = false

[dependencies]
exchange_types = { path = "../exchange_types" }
exchange_level = { path = "../exchange_level" }
exchange_id = { path = "../exchange_id" }
exact_arith = { path = "../../../exact/module/exact_arith" }

