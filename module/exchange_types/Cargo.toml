[package]
name = "exchange_types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Order, trade and event types for the exchange, with no ECS type anywhere"
publish = false

[dependencies]
exact_arith = { workspace = true }
exchange_order = { path = "../exchange_order" }
exchange_side = { path = "../exchange_side" }

[dev-dependencies]
# AccountId/OrderId, for the test helper's own order() fixture — nothing in
# this crate's own src/ reads either; InstrumentId lives here too.
exchange_id = { path = "../exchange_id" }
# The test helper's `order()` fixture needs a `Tif` value for `Order`'s new
# field — nothing in this crate's own src/ reads a Tif.
exchange_tif = { path = "../exchange_tif" }

[lints]
workspace = true
