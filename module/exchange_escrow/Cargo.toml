[package]
name = "exchange_escrow"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The available/reserved balance partition, so an order cannot commit what it does not hold"
publish = false

[dependencies]
exact_arith = { workspace = true }
exchange_fill = { path = "../exchange_fill" }
exchange_id = { path = "../exchange_id" }
exchange_order = { path = "../exchange_order" }
exchange_side = { path = "../exchange_side" }
exchange_types = { path = "../exchange_types" }

[dev-dependencies]
# The test helpers' `Order` fixtures also need `Tif` — nothing in this
# crate's own src/ reads it; `InstrumentId` comes from `exchange_id` above,
# now a real dependency in its own right.
exchange_tif = { path = "../exchange_tif" }

[lints]
workspace = true
