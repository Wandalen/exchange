[package]
name = "exchange_rest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rest, cancel, replace — the three non-matching ways an order moves on the book"
publish = false

[dependencies]
exchange_book = { path = "../exchange_book" }
exchange_id = { path = "../exchange_id" }

[dev-dependencies]
# The test fixture builds a `Resting` by hand, which needs every field of the
# `Order` it wraps — nothing in this crate's own src/ reads these directly.
# `exchange_id` is a real dependency now (see [dependencies]) since
# `rest_cancel`/`rest_replace` take an `InstrumentId`/`OrderId` directly.
exact_kind = { path = "../../../exact/module/exact_kind" }
exchange_order = { path = "../exchange_order" }
exchange_seq = { path = "../exchange_seq" }
exchange_side = { path = "../exchange_side" }
exchange_tif = { path = "../exchange_tif" }

[lints]
workspace = true
