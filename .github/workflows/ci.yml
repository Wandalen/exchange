# Fast verification — master pushes and PRs.
#
# Mirrors `Wandalen/exact`'s own CI structure (itself mirroring `Wandalen/ring`)
# and `verb/test` levels 1-3 (nextest, doctests, clippy) plus `verb/doc`. Deliberately
# has no fmt job: CLAUDE.md forbids `cargo fmt` for this project's custom codestyle.

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Manifests path-depend on `../exact` and `../ring`; pinned so a change there
  # breaks CI only when the pin moves.
  EXACT_REV: fd1b3d1e9e3a5b6f0967e6cba38127b6c638abf8
  RING_REV: 8ce53986356d291161aa7fdecdafc686b79a4a7e

jobs:
  test:
    name: nextest + doctests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-siblings
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: nextest (verb/test level 1)
        run: cargo nextest run --workspace --all-features
      - name: doctests (verb/test level 2)
        run: RUSTDOCFLAGS="-D warnings" cargo test --doc --workspace --all-features

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-siblings
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (verb/lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

  doc:
    name: cargo doc --no-deps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-siblings
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc, warnings denied (verb/doc)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --all-features
