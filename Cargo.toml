[workspace]
resolver = "3"
members = [
  "module/exchange_book",
  "module/exchange_cap",
  "module/exchange_conserve",
  "module/exchange_core",
  "module/exchange_depth",
  "module/exchange_escrow",
  "module/exchange_event",
  "module/exchange_fill",
  "module/exchange_halt",
  "module/exchange_id",
  "module/exchange_idem",
  "module/exchange_inbound",
  "module/exchange_level",
  "module/exchange_match",
  "module/exchange_order",
  "module/exchange_rest",
  "module/exchange_seq",
  "module/exchange_side",
  "module/exchange_snap",
  "module/exchange_spec",
  "module/exchange_stats",
  "module/exchange_stp",
  "module/exchange_tif",
  "module/exchange_types",
  "module/smoke_exchange_book",
  "module/smoke_exchange_phases",
]

# exact and ring, pinned by revision; the three ring crates share one rev, so
# bump them together. To build against local checkouts instead, override them in
# .cargo/config.toml (ignored by git). Cargo ignores, with a warning, a checkout
# whose crate versions are incompatible with the pinned ones:
#   [patch."https://github.com/Wandalen/exact"]
#   exact_arith = { path = "../exact/module/exact_arith" }
#   [patch."https://github.com/Wandalen/ring"]
#   ring_factory = { path = "../ring/ring_factory" }
#   ring_handle = { path = "../ring/ring_handle" }
#   ring_types = { path = "../ring/ring_types" }
[workspace.dependencies]
exact_arith = { git = "https://github.com/Wandalen/exact", rev = "b7e92829bbd4d742fc64ae19a63d12bec5739256" }
ring_factory = { git = "https://github.com/Wandalen/ring", rev = "95988754d34458f0c6c3a5b3ae893b72aeac1505" }
ring_handle = { git = "https://github.com/Wandalen/ring", rev = "95988754d34458f0c6c3a5b3ae893b72aeac1505" }
ring_types = { git = "https://github.com/Wandalen/ring", rev = "95988754d34458f0c6c3a5b3ae893b72aeac1505" }

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe-code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
